.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {

.form-switch .form-check-input:disabled,

.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {

.form-range:focus-visible::-webkit-slider-thumb {

.form-range::-moz-range-track {

.form-range::-moz-range-thumb {

.form-range:focus-visible::-moz-range-thumb {

                &lt;div&gt;
                  &lt;strong id=&quot;ekb-temp-preview-title&quot;&gt;Gangguan pembayaran QRIS sementara&lt;/strong&gt;
                  &lt;div id=&quot;ekb-temp-preview-message&quot;&gt;Transaksi QRIS sedang mengalami gangguan. Edukasi pelanggan untuk mencoba kembali setelah pukul 18.00 dan jangan membuat tiket duplikat.&lt;/div&gt;
                  &lt;small&gt;Aktif sampai 18.00&lt;/small&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;p class=&quot;ekb-muted&quot;&gt;Saat waktu berakhir, banner hilang otomatis dan flow normal kembali tampil.&lt;/p&gt;
            &lt;/aside&gt;
          &lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;ekb-screen&quot; data-admin-panel=&quot;review&quot; hidden&gt;
          &lt;div class=&quot;ekb-admin-list-header&quot;&gt;
            &lt;div&gt;
              &lt;h1&gt;Konten Perlu Diperiksa&lt;/h1&gt;
              &lt;p class=&quot;ekb-muted&quot;&gt;Jika informasinya masih benar, cukup klik “Sudah diperiksa”.&lt;/p&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;ekb-review-list&quot;&gt;
            &lt;div class=&quot;ekb-review-row&quot;&gt;
              &lt;div&gt;
                &lt;strong&gt;Kontak Anti Fraud &amp; Credit Analyst&lt;/strong&gt;
                &lt;div class=&quot;ekb-muted&quot;&gt;Kontak / Referensi · Terakhir diperiksa 31 hari lalu&lt;/div&gt;
              &lt;/div&gt;
              &lt;button type=&quot;button&quot; class=&quot;ekb-action&quot; data-review-confirm&gt;Sudah diperiksa&lt;/button&gt;
            &lt;/div&gt;
            &lt;div class=&quot;ekb-review-row&quot;&gt;
              &lt;div&gt;
                &lt;strong&gt;Kontak Lazada Customer Care&lt;/strong&gt;
                &lt;div class=&quot;ekb-muted&quot;&gt;Kontak / Referensi · Terakhir diperiksa 34 hari lalu&lt;/div&gt;
              &lt;/div&gt;
              &lt;button type=&quot;button&quot; class=&quot;ekb-action&quot; data-review-confirm&gt;Sudah diperiksa&lt;/button&gt;
            &lt;/div&gt;
            &lt;div class=&quot;ekb-review-row&quot;&gt;
              &lt;div&gt;
                &lt;strong&gt;Ketentuan Verifikasi Data Live Chat&lt;/strong&gt;
                &lt;div class=&quot;ekb-muted&quot;&gt;Kebijakan umum · Terakhir diperiksa 91 hari lalu&lt;/div&gt;
              &lt;/div&gt;
              &lt;button type=&quot;button&quot; class=&quot;ekb-action&quot; data-admin-screen=&quot;edit&quot;&gt;Buka dan periksa&lt;/button&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/section&gt;
      &lt;/main&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;ekb-wireframe-v3&#x27;);
      if (!root) return;

      const modeButtons = Array.from(root.querySelectorAll(&#x27;[data-ekb-mode]&#x27;));
      const modePanels = Array.from(root.querySelectorAll(&#x27;[data-ekb-mode-panel]&#x27;));
      const agentButtons = Array.from(root.querySelectorAll(&#x27;[data-agent-screen]&#x27;));
      const agentPanels = Array.from(root.querySelectorAll(&#x27;[data-agent-panel]&#x27;));
      const adminButtons = Array.from(root.querySelectorAll(&#x27;[data-admin-screen]&#x27;));
      const adminPanels = Array.from(root.querySelectorAll(&#x27;[data-admin-panel]&#x27;));

      function activateMode(mode) {
        modeButtons.forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.ekbMode === mode)));
        modePanels.forEach((panel) =&gt; { panel.hidden = panel.dataset.ekbModePanel !== mode; });
      }

      function activateScreen(type, screen) {
        const panels = type === &#x27;agent&#x27; ? agentPanels : adminPanels;
        const buttons = type === &#x27;agent&#x27; ? agentButtons : adminButtons;
        panels.forEach((panel) =&gt; { panel.hidden = panel.dataset[`${type}Panel`] !== screen; });
        buttons.forEach((button) =&gt; {
          if (button.closest(&#x27;nav&#x27;)) {
            if (button.dataset[`${type}Screen`] === screen) button.setAttribute(&#x27;aria-current&#x27;, &#x27;page&#x27;);
            else button.removeAttribute(&#x27;aria-current&#x27;);
          }
        });
      }

      modeButtons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; activateMode(button.dataset.ekbMode)));
      agentButtons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; activateScreen(&#x27;agent&#x27;, button.dataset.agentScreen)));
      adminButtons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; activateScreen(&#x27;admin&#x27;, button.dataset.adminScreen)));

      root.querySelectorAll(&#x27;[data-open-detail]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; activateScreen(&#x27;agent&#x27;, &#x27;detail&#x27;)));

      const homeSearchForm = root.querySelector(&#x27;#ekb-home-search-form&#x27;);
      const homeQuery = root.querySelector(&#x27;#ekb-home-query&#x27;);
      const resultQuery = root.querySelector(&#x27;#ekb-result-query&#x27;);
      const queryLabel = root.querySelector(&#x27;#ekb-query-label&#x27;);
      homeSearchForm.addEventListener(&#x27;submit&#x27;, (event) =&gt; {
        event.preventDefault();
        const query = homeQuery.value.trim() || &#x27;tagihan belum masuk&#x27;;
        resultQuery.value = query;
        queryLabel.textContent = query;
        activateScreen(&#x27;agent&#x27;, &#x27;search&#x27;);
      });

      resultQuery.addEventListener(&#x27;input&#x27;, () =&gt; {
        queryLabel.textContent = resultQuery.value.trim() || &#x27;semua pedoman&#x27;;
      });

      const copyButton = root.querySelector(&#x27;#ekb-copy-script&#x27;);
      const agentScript = root.querySelector(&#x27;#ekb-agent-script&#x27;);
      copyButton.addEventListener(&#x27;click&#x27;, async () =&gt; {
        try {
          if (navigator.clipboard) await navigator.clipboard.writeText(agentScript.textContent.trim());
          copyButton.textContent = &#x27;Tersalin&#x27;;
        } catch (_) {
          copyButton.textContent = &#x27;Siap disalin&#x27;;
        }
        setTimeout(() =&gt; { copyButton.textContent = &#x27;Salin skrip&#x27;; }, 1400);
      });

      const favoriteButton = root.querySelector(&#x27;#ekb-favorite-button&#x27;);
      favoriteButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        const next = favoriteButton.getAttribute(&#x27;aria-pressed&#x27;) !== &#x27;true&#x27;;
        favoriteButton.setAttribute(&#x27;aria-pressed&#x27;, String(next));
        favoriteButton.textContent = next ? &#x27;Tersimpan di favorit&#x27; : &#x27;Favorit&#x27;;
      });

      const resolution = root.querySelector(&#x27;#ekb-resolution&#x27;);
      const escalationFields = root.querySelector(&#x27;#ekb-escalation-fields&#x27;);
      const transferFields = root.querySelector(&#x27;#ekb-transfer-fields&#x27;);
      const previewAction = root.querySelector(&#x27;#ekb-preview-action&#x27;);
      const previewWarning = root.querySelector(&#x27;#ekb-preview-warning&#x27;);

      const resolutionLabels = {
        done: &#x27;Selesai di Tier 1&#x27;,
        ticket: &#x27;Buat tiket&#x27;,
        escalate: &#x27;Eskalasi Tier 2/3&#x27;,
        transfer: &#x27;Transfer ke ASI&#x27;,
        reference: &#x27;Referensi saja&#x27;
      };

      function updateResolution() {
        const value = resolution.value;
        escalationFields.hidden = value !== &#x27;escalate&#x27;;
        transferFields.hidden = value !== &#x27;transfer&#x27;;
        previewAction.textContent = resolutionLabels[value];
        if (value === &#x27;escalate&#x27;) previewWarning.lastElementChild.textContent = &#x27;Artikel akan menampilkan tim eskalasi dan status CRM kepada agent.&#x27;;
        else if (value === &#x27;transfer&#x27;) previewWarning.lastElementChild.textContent = &#x27;Artikel akan menampilkan skrip transfer ASI dan menyembunyikan flow Tier yang tidak relevan.&#x27;;
        else if (value === &#x27;done&#x27;) previewWarning.lastElementChild.textContent = &#x27;Artikel akan tampil sebagai kasus selesai di Tier 1 tanpa bagian eskalasi.&#x27;;
        else previewWarning.lastElementChild.textContent = &#x27;Sistem hanya menampilkan bagian yang relevan untuk jenis tindakan ini.&#x27;;
      }

      resolution.addEventListener(&#x27;change&#x27;, updateResolution);
      updateResolution();

      const adminTitle = root.querySelector(&#x27;#ekb-title&#x27;);
      const adminCondition = root.querySelector(&#x27;#ekb-condition&#x27;);
      const adminScript = root.querySelector(&#x27;#ekb-script&#x27;);
      const adminProduct = root.querySelector(&#x27;#ekb-product&#x27;);
      const adminCategory = root.querySelector(&#x27;#ekb-category&#x27;);
      const previewTitle = root.querySelector(&#x27;#ekb-preview-title&#x27;);
      const previewCondition = root.querySelector(&#x27;#ekb-preview-condition&#x27;);
      const previewScript = root.querySelector(&#x27;#ekb-preview-script&#x27;);
      const previewTaxonomy = root.querySelector(&#x27;#ekb-preview-taxonomy&#x27;);

      function updatePreview() {
        previewTitle.textContent = adminTitle.value.trim() || &#x27;Judul kondisi belum diisi&#x27;;
        previewCondition.textContent = adminCondition.value.trim() || &#x27;Kondisi pelanggan belum diisi.&#x27;;
        previewScript.textContent = adminScript.value.trim() || &#x27;Skrip Live Chat belum diisi.&#x27;;
        previewTaxonomy.textContent = `${adminProduct.value} · ${adminCategory.value}`;
        updateResolution();
      }

      [adminTitle, adminCondition, adminScript, adminProduct, adminCategory].forEach((field) =&gt; field.addEventListener(&#x27;input&#x27;, updatePreview));
      root.querySelector(&#x27;#ekb-preview-button&#x27;).addEventListener(&#x27;click&#x27;, updatePreview);

      const adminForm = root.querySelector(&#x27;#ekb-admin-form&#x27;);
      const publishStatus = root.querySelector(&#x27;#ekb-publish-status&#x27;);
      adminForm.addEventListener(&#x27;submit&#x27;, (event) =&gt; {
        event.preventDefault();
        updatePreview();
        publishStatus.textContent = &#x27;Published. Versi baru dan riwayat perubahan tersimpan otomatis.&#x27;;
      });

      const tempTitle = root.querySelector(&#x27;#ekb-temp-title&#x27;);
      const tempMessage = root.querySelector(&#x27;#ekb-temp-message&#x27;);
      const tempPreviewTitle = root.querySelector(&#x27;#ekb-temp-preview-title&#x27;);
      const tempPreviewMessage = root.querySelector(&#x27;#ekb-temp-preview-message&#x27;);
      [tempTitle, tempMessage].forEach((field) =&gt; field.addEventListener(&#x27;input&#x27;, () =&gt; {
        tempPreviewTitle.textContent = tempTitle.value.trim() || &#x27;Judul update sementara&#x27;;
        tempPreviewMessage.textContent = tempMessage.value.trim() || &#x27;Informasi untuk agent belum diisi.&#x27;;
      }));

      const temporaryForm = root.querySelector(&#x27;#ekb-temporary-form&#x27;);
      const temporaryStatus = root.querySelector(&#x27;#ekb-temp-status&#x27;);
      temporaryForm.addEventListener(&#x27;submit&#x27;, (event) =&gt; {
        event.preventDefault();
        temporaryStatus.textContent = &#x27;Update dipublikasikan dan akan berhenti tampil otomatis pada waktu berakhir.&#x27;;
      });

      root.querySelectorAll(&#x27;[data-review-confirm]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        button.textContent = &#x27;Sudah diperiksa hari ini&#x27;;
        button.disabled = true;
      }));
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
